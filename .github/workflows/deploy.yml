name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy_master:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: GH_PAT
          script: |
            set -e

            cd /home/goridenetincwdin/gowhatsapp

            echo "=== Deployment started at $(date) ==="

            # Authenticate via HTTPS using the passed Personal Access Token
            git remote set-url origin "https://${GH_PAT}@github.com/srihemainfo/gowhatsapp.git"


            echo "Pulling latest changes..."

            git fetch origin master
            git reset --hard origin/master

            echo "Clearing Laravel cache and optimizing..."
            php artisan cache:clear
            php artisan optimize:clear

            echo "=== Deployment finished successfully ==="